esphome:
  name: tor-screen-test
  friendly_name: TOR Screen Test

esp8266:
  board: esp12e

logger:
  level: INFO

wifi:
  ap:
    ssid: "TOR-Screen-Setup"
    password: !secret fallback_ap_password
    ap_timeout: 10s

captive_portal:

web_server:
  port: 80
  version: 2
  local: true
  auth:
    username: admin
    password: !secret web_password

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: display_spi

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 1000 Hz
    id: backlight_pwm
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON

font:
  - file: "/usr/share/fonts/google-noto/NotoSansMono-Regular.ttf"
    id: terminal_font
    size: 8
    bpp: 1
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "°∙"
      - "┌─┐│└┘"
      - "├┤┼"
      - "╔═╗║╚╝"
      - "╓┬╖╤╕╧╒╙┴╜╘╛╬"
      - "█▄▀▌▐░▒▓"


  - file: "/usr/share/fonts/google-noto/NotoSansMono-Regular.ttf"
    id: boot_font
    size: 14
    bpp: 1
    glyphs:
      - " .:-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

color:
  - id: black
    red: 0%
    green: 0%
    blue: 0%

  - id: white
    red: 100%
    green: 100%
    blue: 100%


display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: display_spi

    dimensions:
      width: 240
      height: 240
      offset_width: 0
      offset_height: 0

    dc_pin: GPIO00
    reset_pin: GPIO02

    buffer_size: 25%
    color_depth: 8
    color_order: BGR
    invert_colors: true

    spi_mode: mode3
    data_rate: 40000000

    rotation: 0
    update_interval: never
    auto_clear_enabled: false

    lambda: |-
      it.fill(id(black));

      if (!id(tg_display).has_frame()) {
        std::string ip = id(tg_display).get_ip_address();
        std::string code = id(tg_display).get_pairing_code();

        it.printf(
          120, 10,
          id(boot_font),
          id(white),
          TextAlign::TOP_CENTER,
          "TAMAGONION"
        );

        it.printf(
          120, 50,
          id(boot_font),
          id(white),
          TextAlign::TOP_CENTER,
          "IP %s",
          ip.c_str()
        );

        it.printf(
          120, 78,
          id(boot_font),
          id(white),
          TextAlign::TOP_CENTER,
          "PORT %u",
          id(tg_display).get_port()
        );

        it.printf(
          120, 112,
          id(boot_font),
          id(white),
          TextAlign::TOP_CENTER,
          "PAIRING CODE"
        );

        it.printf(
          120, 142,
          id(boot_font),
          id(white),
          TextAlign::TOP_CENTER,
          "%s",
          code.c_str()
        );

        it.printf(
          120, 195,
          id(terminal_font),
          id(white),
          TextAlign::TOP_CENTER,
          "Waiting for Tamagonion..."
        );

        return;
      }

      const auto &lines = id(tg_display).get_lines();

      for (size_t i = 0; i < lines.size() && i < 20; i++) {
        it.print(
          0,
          i * 12,
          id(terminal_font),
          id(white),
          lines[i].c_str()
        );
      }

external_components:
  - source: components

tamagonion_display:
  id: tg_display
  pairing_code: !secret tamagonion_pairing_code
  display_id: lcd
  port: 18511
  max_frame_size: 4096
