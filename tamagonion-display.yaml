esphome:
  name: tamagonion-display
  friendly_name: Tamagonion Display

esp8266:
  board: esp12e

logger:
  level: INFO

wifi:
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Tamagonion Display Setup"
    password: !secret fallback_ap_password
    ap_timeout: 10s

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: components

tamagonion_display:
  id: tg_display
  display_id: lcd
  pairing_code: !secret tamagonion_pairing_code
  port: 18511
  max_frame_size: 4096

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: display_spi

output:
  - platform: esp8266_pwm
    id: backlight_pwm
    pin: GPIO05
    frequency: 1000 Hz
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

color:
  - id: black
    red: 0%
    green: 0%
    blue: 0%
  - id: white
    red: 100%
    green: 100%
    blue: 100%

font:
  - file:
      type: gfonts
      family: "Noto Sans Mono"
    id: terminal_font
    size: 8
    bpp: 1
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "°∙"
      - "┌─┐│└┘├┤┼"
      - "╔═╗║╚╝"
      - "╓┬╖╤╕╧╒╙┴╜╘╛╬"
      - "█▄▀▌▐░▒▓"

  - file:
      type: gfonts
      family: "Noto Sans Mono"
    id: setup_font
    size: 14
    bpp: 1
    glyphs:
      - " .:-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: display_spi
    dimensions:
      width: 240
      height: 240
      offset_width: 0
      offset_height: 0
    dc_pin: GPIO00
    reset_pin: GPIO02
    buffer_size: 25%
    color_depth: 8
    color_order: BGR
    invert_colors: true
    spi_mode: mode3
    data_rate: 40000000
    rotation: 0
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      it.fill(id(black));

      if (!id(tg_display).has_frame()) {
        const std::string ip = id(tg_display).get_ip_address();
        const std::string &pairing_code = id(tg_display).get_pairing_code();

        it.printf(
          120, 10,
          id(setup_font),
          id(white),
          TextAlign::TOP_CENTER,
          "TAMAGONION"
        );

        it.printf(
          120, 50,
          id(setup_font),
          id(white),
          TextAlign::TOP_CENTER,
          "IP %s",
          ip.c_str()
        );

        it.printf(
          120, 78,
          id(setup_font),
          id(white),
          TextAlign::TOP_CENTER,
          "PORT %u",
          id(tg_display).get_port()
        );

        it.printf(
          120, 112,
          id(setup_font),
          id(white),
          TextAlign::TOP_CENTER,
          "PAIRING CODE"
        );

        it.printf(
          120, 142,
          id(setup_font),
          id(white),
          TextAlign::TOP_CENTER,
          "%s",
          pairing_code.c_str()
        );

        const char *status = "Waiting for Tamagonion...";
        if (id(tg_display).is_authenticated()) {
          status = "Authenticated - waiting for frame";
        } else if (id(tg_display).has_client()) {
          status = "Authenticating...";
        }

        it.printf(
          120, 195,
          id(terminal_font),
          id(white),
          TextAlign::TOP_CENTER,
          "%s",
          status
        );
        return;
      }

      for (size_t line = 0; line < id(tg_display).get_line_count(); ++line) {
        it.print(
          0,
          line * 12,
          id(terminal_font),
          id(white),
          id(tg_display).get_line(line).c_str()
        );
      }
